name: Docs

# Build-only on this unofficial fork. Do NOT deploy GitHub Pages:
# that would publish docs as if they were the official JuhLabs wiki.

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Pinned rather than "3.x" so the interpreter matches the one
          # docs/requirements.txt was compiled against; --require-hashes
          # resolution is Python-version sensitive.
          python-version: "3.14"
      - run: pip install --require-hashes -r docs/requirements.txt
      - run: mkdocs build
      # Intentionally no actions/upload-pages-artifact or actions/deploy-pages.
